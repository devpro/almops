# IstarCI configuration, read from the root of the repository.

runner:
  # podman builds and loads images, and docker:dind serves the scan, which need the privileged containers a GitLab runner gives them.
  privileged:
    - "podman-*"
    - neuvector_scan
  # The analysis of dotnet-test runs against the SonarQube IstarCI starts on this machine, with a token made there.
  sonarqube: true

workflow:
  # IstarCI holds no external credential, and the scan logs in to Docker Hub.
  skipJobs:
    - neuvector_scan
  # The pipeline runs on a merge request or on the default branch only, so a local run on a feature branch skips the rules instead of evaluating them.
  respectTriggers: false

# The project CI/CD variables of GitLab, with local values: the image is built and scanned here, and pushed only from main on GitLab.
vars:
  CONTAINER_REGISTRY_DOMAIN: localhost
  CONTAINER_REGISTRY_USER: local
  # The local SonarQube, under the names dotnet-test reads.
  SONAR_HOSTURL: $SONAR_HOST_URL
  SONAR_ORGANIZATION: local
  SONAR_PROJECTKEY: almops
  # The tests against live Azure DevOps and GitLab sandboxes need real credentials, which IstarCI never holds.
  DOTNET_TEST_EXTRA_PARAMETERS: --filter Environment!=Sandbox
